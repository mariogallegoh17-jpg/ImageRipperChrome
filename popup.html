  <title>Image Ripper</title>  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 390px;
      max-height: 600px;
      overflow-y: auto;
      background: #101010;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 16px;
      background: #181818;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0;
      font-size: 21px;
      letter-spacing: 1px;
    }

    .subtitle {
      margin-top: 5px;
      color: #888;
      font-size: 11px;
    }

    .controls {
      padding: 12px;
      display: flex;
      gap: 8px;
      position: sticky;
      top: 73px;
      background: #101010;
      z-index: 9;
    }

    button {
      flex: 1;
      border: 1px solid #555;
      border-radius: 7px;
      padding: 11px 7px;
      background: #272727;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #353535;
    }

    #downloadAll {
      background: #761414;
      border-color: #a32929;
    }

    #downloadAll:hover {
      background: #962020;
    }

    .info {
      padding: 0 12px 10px;
      color: #aaa;
      font-size: 12px;
    }

    #images {
      padding: 0 12px 18px;
    }

    .empty {
      padding: 30px 15px;
      text-align: center;
      color: #777;
    }

  </style></head><body>  <header><h1>IMAGE RIPPER</h1>

<div class="subtitle">
  Detector de imágenes y versiones originales
</div>

  </header>  <div class="controls"><button id="scan">
  ESCANEAR
</button>

<button id="downloadAll">
  DESCARGAR SELECCIONADAS
</button>

  </div>  <div id="info" class="info">
    Pulsa ESCANEAR para comenzar.
  </div>  <div id="images"><div class="empty">
  No se han detectado imágenes.
</div>

  </div>  <script src="popup.js"></script></body></html>
