<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Ripper</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 360px;
      min-height: 500px;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px;
      background: #181818;
      border-bottom: 1px solid #333;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    .subtitle {
      margin-top: 5px;
      color: #999;
      font-size: 12px;
    }

    .controls {
      padding: 14px;
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      border: 1px solid #555;
      border-radius: 7px;
      padding: 11px 8px;
      background: #252525;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #downloadAll {
      background: #7d1111;
      border-color: #a52a2a;
    }

    #downloadAll:hover {
      background: #a51c1c;
    }

    .info {
      padding: 0 14px 12px;
      color: #aaa;
      font-size: 13px;
    }

    #images {
      padding: 0 12px 15px;
    }

    .image-item {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 9px;
      margin-bottom: 8px;
      background: #1c1c1c;
      border: 1px solid #303030;
      border-radius: 8px;
    }

    .image-item img {
      width: 65px;
      height: 55px;
      object-fit: cover;
      border-radius: 5px;
      background: #000;
    }

    .details {
      min-width: 0;
      flex: 1;
    }

    .size {
      font-size: 12px;
      color: #ddd;
    }

    .url {
      margin-top: 4px;
      font-size: 10px;
      color: #777;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }

    .empty {
      padding: 30px 15px;
      text-align: center;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>IMAGE RIPPER</h1>
    <div class="subtitle">Detector de imágenes originales</div>
  </header>

  <div class="controls">
    <button id="scan">ESCANEAR</button>
    <button id="downloadAll">DESCARGAR TODAS</button>
  </div>

  <div class="info" id="info">
    Pulsa ESCANEAR para comenzar.
  </div>

  <div id="images">
    <div class="empty">
      No se han detectado imágenes.
    </div>
  </div>

  <script src="popup.js"></script>

</body>
</html>
